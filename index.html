async function k(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:d(C.s),iterations:C.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt'])}
async function open_(key,save){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(C.v)},key,d(C.c));const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));if(save)localStorage.setItem('tgl_k',raw);try{sessionStorage.setItem('tgl_s',raw)}catch(x){}e.innerHTML='<span class=sk></span><span class=sk></span><span class="sk short"></span>';const h=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(h);document.close()}
